# Phase 1 (language / accent adaptation) mix, as described in the blueprint §3.1.
# Status: proposed. Numbers are blueprint/brief figures, not verified in this repo.
name: tts-lang-phase1
version: 0
status: proposed
purpose: Teach HK pronunciation, conversational rhythm and code-switching; 100% HK speakers; 0% CV yue.
manifest_schema: 0.1.0

global_filters:
  min_duration_s: 3.0       # = 36 frames at 12 Hz (Qwen3-TTS-Tokenizer-12Hz)
  max_duration_s: 25.0
  accent_in: [zh-HK-native, zh-HK-likely]
  split: train
  min_snr_db: 15.0
  min_single_speaker_sim: 0.75   # Reject multi-speaker interview turns (crucial for Mill MILK / DoShow / BBO / Chong)
  require_no_digits: true
  min_colloquial_score: null

sources:
  - source: hk-youtube-conversational
    manifest: "data_yue/manifests/yt_train.jsonl"
    manifest_sha256: "94ca6f5dc17fb7316316595faef0c4795fb5c56f5e5fcf0aba535112a4d01174"
    weight: 1.0
    hours_cap: null
    per_speaker_hours_cap: 15.0
    filters: {}
  - source: cv-zh-hk
    manifest: "data_yue/manifests/cvhk_train.jsonl"
    manifest_sha256: null
    weight: 1.0
    hours_cap: null
    per_speaker_hours_cap: null
    filters: {}
  - source: mdcc
    manifest: "data_yue/manifests/mdcc_train.jsonl"
    manifest_sha256: null
    weight: 1.0
    hours_cap: null
    per_speaker_hours_cap: null
    filters: {}
  - source: mce
    manifest: "data_yue/manifests/mce_train.jsonl"
    manifest_sha256: null
    weight: 1.0
    hours_cap: null
    per_speaker_hours_cap: null
    filters: {}

excluded_sources:
  - source: cv-yue
    reason: non-HK accent majority; causes PRD accent

built:
  experiment: null
  hours: null
  clips: null
  speakers: null
